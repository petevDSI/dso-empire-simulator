<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Smile Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1122;--bg2:#0f1b34;--panel:#132345;--panel2:#1a2f5a;--line:#27407a;
  --teal:#2dd4bf;--teal2:#0d9488;--gold:#fbbf24;--gold2:#f59e0b;--pink:#f472b6;--red:#ef4444;--green:#22c55e;
  --txt:#e8f1ff;--dim:#8ea6d0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
body{background:
  radial-gradient(1200px 600px at 50% -10%,#1b3a7a55,transparent 60%),
  radial-gradient(800px 500px at 100% 100%,#0d948833,transparent 60%),
  var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
#dsoBack{position:fixed;left:8px;bottom:calc(62px + env(safe-area-inset-bottom));z-index:95;padding:7px 12px;border-radius:99px;background:#1c0f38ee;border:1.5px solid #ff9d2e;color:#ffd9a0;font:700 12px 'Nunito',system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px #000a}
#dsoBack:hover{background:#2c1656}
#gate{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(900px 500px at 50% 0,#3a1a70,#0d0620 70%);color:#ffe9c4}
#gate h1{font-family:'Lilita One',sans-serif;font-size:34px;margin:0;color:#ff9d2e;text-shadow:0 3px 0 #5a2a00}
#gate p{max-width:420px;margin:0;font-size:16px;line-height:1.45;color:#e9d9ff}
#gate a{display:inline-block;margin-top:6px;padding:12px 22px;border-radius:14px;background:linear-gradient(#ff9d2e,#e07410);color:#2a0f00;font:800 16px 'Nunito',system-ui,sans-serif;text-decoration:none;border:2px solid #2a0f00}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#app{position:relative;max-width:640px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 12px 6px;background:linear-gradient(180deg,#152b58,#0f1f42);border-bottom:2px solid var(--line);box-shadow:0 6px 18px #0008;position:relative;z-index:5}
#mascot{width:64px;height:64px;flex:none;cursor:pointer;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 6px #0008)}
#mascot:active{transform:scale(.9)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.cashbox{flex:1;min-width:0;text-align:center}
.cashbox .lbl{font-size:11px;letter-spacing:3px;color:var(--dim)}
#cash{font-family:'Lilita One','Fredoka',sans-serif;font-size:34px;line-height:1;color:var(--gold);text-shadow:0 0 14px #fbbf2466,0 3px 0 #7c4a03;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#inc{font-size:13px;color:var(--teal);font-weight:600}
.hbtns{display:flex;flex-direction:column;gap:4px}
.hbtns button{width:38px;height:30px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:16px;line-height:1}
.hbtns button.ready{animation:pulse 1s infinite;background:linear-gradient(#f9a8d4,#ec4899)}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 14px #f472b6}}
#rank{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;font-size:12px;background:#0c1730;color:var(--dim)}
#rank b{color:var(--txt)}
#lpb{color:var(--pink);font-weight:600}
#buffs{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px;min-height:0}
.buff{margin-top:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#3a2300;animation:pulse 1.4s infinite}
#goal{margin:8px 12px 0;padding:6px 10px;border-radius:12px;background:linear-gradient(90deg,#1c3a72,#163060);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:8px}
#goal .gt{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal .gb{width:90px;height:8px;border-radius:9px;background:#0a1430;overflow:hidden;flex:none}
#goal .gb i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0}
#hwTrack{margin:8px 12px 0;padding:8px 10px;border-radius:12px;background:linear-gradient(90deg,#2a1150,#1c0f38);border:1px solid var(--line);cursor:pointer}
.hwt-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#e9d5ff}
.hwt-nodes{display:flex;align-items:center;margin-top:6px}
.hwt-node{position:relative;width:38px;height:38px;border-radius:11px;background:#150a2c;border:2px solid #4a2a80;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font-size:16px}
.hwt-node img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) brightness(.5);opacity:.4}
.hwt-node.got{border-color:#facc15;box-shadow:0 0 10px #facc1588}
.hwt-node.got img{filter:none;opacity:1}
.hwt-node.waiting{border-color:#a855f7;box-shadow:0 0 8px #a855f766}
.hwt-node.waiting img{filter:grayscale(.35) brightness(.8);opacity:.8}
.hwt-node .pr{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#a855f7,#facc15);width:0}
.hwt-node .lk{position:absolute;top:-4px;right:-4px;font-size:11px;background:#0d0620;border-radius:7px;padding:1px 3px;line-height:1;border:1px solid #4a2a80}
.hwt-link{flex:1;height:3px;background:#4a2a80;margin:0 3px;border-radius:3px;min-width:8px}
.hwt-link.done{background:#facc15}
.hwt-lifebar{position:relative;margin-top:8px;height:16px;border-radius:8px;background:#150a2c;border:1px solid #4a2a80;overflow:hidden}
.hwt-lifebar-fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#7c3aed,#a855f7,#facc15);transition:width .4s ease}
.hwt-lifebar span{position:relative;z-index:1;display:block;text-align:center;font-size:10px;line-height:16px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.hwt-next{font-size:11px;color:#c4b5fd;margin-top:5px}
#modes{display:flex;gap:6px;padding:8px 12px 4px}
#modes button{flex:1;padding:6px 0;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--dim)}
#modes button.on{background:linear-gradient(#34d399,#059669);color:#04231a;border-color:#6ee7b7;box-shadow:0 0 12px #34d39955}
main{flex:1;min-height:0;position:relative}
.panel{display:none;position:absolute;inset:0;overflow-y:auto;padding:6px 12px 14px;-webkit-overflow-scrolling:touch}
.panel.on{display:block}
.panel::-webkit-scrollbar{width:6px}.panel::-webkit-scrollbar-thumb{background:#2b4a8a;border-radius:6px}
/* business */
.biz{display:flex;align-items:center;gap:10px;margin:8px 0;padding:8px;border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:0 4px 0 #0a1633,0 8px 16px #0005;position:relative;overflow:hidden}
.biz.myst{opacity:.75;filter:grayscale(1)}
.biz .icon{width:66px;height:66px;flex:none;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;cursor:pointer;box-shadow:inset 0 -6px 0 #0004,inset 0 3px 0 #fff4,0 3px 0 #0006;transition:transform .08s}
.biz .icon:active{transform:scale(.92)}
.biz .icon.idle::after{content:'TAP';position:absolute;bottom:-2px;font-size:9px;letter-spacing:1px;background:#0009;padding:0 6px;border-radius:6px;animation:pulse 1s infinite}
.biz .own{position:absolute;top:-6px;left:-6px;min-width:26px;padding:1px 6px;text-align:center;border-radius:99px;background:#0b1430;border:2px solid var(--gold);font-size:12px;font-weight:700;color:var(--gold)}
.biz .mid{flex:1;min-width:0}
.biz .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:22px;border-radius:99px;background:#081029;border:1px solid #2b4a8a;overflow:hidden;margin-top:2px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(180deg,#5eead4,#0d9488);border-radius:99px}
.bar .fill.flow{background:repeating-linear-gradient(115deg,#5eead4 0 12px,#14b8a6 12px 24px);background-size:34px 100%;animation:flow .5s linear infinite}
@keyframes flow{to{background-position:34px 0}}
.bar .fill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#fff5,transparent 55%)}
.bar .btxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-shadow:0 1px 2px #000a}
.ms{display:flex;align-items:center;gap:6px;margin-top:4px}
.msbar{flex:1;height:7px;border-radius:9px;background:#081029;overflow:hidden}
.msbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f472b6,#fbbf24)}
.mstxt{font-size:10.5px;color:var(--dim);white-space:nowrap}
.buy{flex:none;width:104px;padding:7px 4px;border-radius:14px;background:linear-gradient(180deg,#475a86,#33436b);color:#a9b8d8;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 #1b2748}
.buy .bl{font-size:11px;font-weight:600;letter-spacing:1px}
.buy .bc{font-size:15px;font-weight:700}
.buy.can{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#3a2300;box-shadow:0 4px 0 #a86205,0 0 14px #fbbf2455}
.buy.can:active,.hire.can:active{transform:translateY(3px);box-shadow:0 1px 0 #a86205}
.hire{flex:none;width:112px;padding:8px 4px;border-radius:14px;background:linear-gradient(180deg,#475a86,#33436b);color:#a9b8d8;font-weight:700;font-size:14px;box-shadow:0 4px 0 #1b2748}
.hire.can{background:linear-gradient(180deg,#f9a8d4,#ec4899);color:#3b0421;box-shadow:0 4px 0 #9d174d,0 0 14px #f472b655}
.hire.done{background:#16a34a33;color:#86efac;box-shadow:none}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px;border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line)}
.row .em{font-size:30px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#0b1430;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:14px}
.row .tx span{font-size:12px;color:var(--dim)}
h3{margin:14px 2px 4px;font-family:'Lilita One',sans-serif;font-weight:400;letter-spacing:1px;font-size:20px;color:var(--gold)}
p.note{margin:4px 2px 8px;font-size:13px;color:var(--dim);line-height:1.4}
/* unlocks */
.utabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.utabs button{flex:none;width:44px;height:44px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-size:22px}
.utabs button.on{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 12px #fbbf2455}
.ugrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:12px;background:#dccfbd;color:#5b4a37;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;border:2px solid #b8a68c;cursor:pointer}
.tile .e{font-size:24px;filter:grayscale(1) opacity(.55)}
.biz-ic{width:26px;height:26px;object-fit:contain;vertical-align:middle;pointer-events:none}
.biz .icon .biz-ic{width:48px;height:48px}
.row .em .biz-ic{width:32px;height:32px}
.utabs button .biz-ic{width:28px;height:28px}
.tile .n{font-size:15px}
.tile.got{background:linear-gradient(180deg,#fde68a,#f59e0b);border-color:#fff3;color:#3a2300;box-shadow:0 0 12px #fbbf2466}
.tile.got .e{filter:none}
.tile .lk{position:absolute;top:-6px;left:-6px;font-size:14px}
#uinfo{margin:10px 0;padding:10px;border-radius:12px;background:#f8f1e4;color:#3a2a14;font-weight:600;text-align:center;font-size:14px;min-height:42px}
/* legacy */
.bigbtn{display:block;width:100%;padding:14px;border-radius:16px;background:linear-gradient(180deg,#f9a8d4,#ec4899);color:#3b0421;font-weight:700;font-size:17px;box-shadow:0 5px 0 #9d174d;margin:10px 0}
.bigbtn.dis{background:#33436b;color:#8ea6d0;box-shadow:0 5px 0 #1b2748}
.stat{display:flex;justify-content:space-between;padding:6px 4px;font-size:14px;border-bottom:1px dashed #27407a}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;opacity:.5}
.ach.got{opacity:1;background:linear-gradient(180deg,#1f4a3f,#15332c);border-color:#34d399}
.hwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.hwcard{padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12px;text-align:center;opacity:.75}
.hwcard.got{opacity:1;background:linear-gradient(180deg,#3a2f0a,#241c05);border-color:var(--gold);box-shadow:0 0 14px #facc1533}
.hwc-art{width:72px;height:72px;margin:0 auto 6px;border-radius:12px;background:#0d0620;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.hwc-art img{width:100%;height:100%;object-fit:contain}
.hwcard:not(.got) .hwc-art img{filter:grayscale(1) brightness(.6);opacity:.6}
.hwcard b{display:block;margin:4px 0 2px;font-size:12px}
.hwc-rarity{display:inline-block;margin-bottom:6px;padding:1px 8px;border-radius:99px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#2a2a2a;color:#ccc}
.hwc-rarity.common{background:#3a3f4d;color:#cbd5e1}
.hwc-rarity.uncommon{background:#0f3d2e;color:#86efac}
.hwc-rarity.rare{background:#1e3a6a;color:#93c5fd}
.hwc-rarity.epic{background:#4c1d7a;color:#e9d5ff}
.hwc-rarity.legendary{background:#7a4a06;color:#fde68a}
.hwc-bar{height:6px;border-radius:6px;background:#0a1430;overflow:hidden;margin-bottom:6px}
.hwc-bar i{display:block;height:100%;background:linear-gradient(90deg,#a855f7,var(--gold))}
.hwcard span{color:var(--dim);font-size:11px;line-height:1.3}
.hwcard.got span{color:#fde68a}
.ach b{display:block;font-size:13px}
.slider{width:100%}
.mini{padding:8px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;margin:4px 4px 4px 0}
#tip{padding:5px 14px;font-size:12px;color:var(--dim);background:#0a1430;text-align:center;min-height:26px}
nav{display:flex;background:linear-gradient(180deg,#152b58,#0d1a38);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:7px 0 6px;background:none;font-size:20px;position:relative;color:var(--dim)}
nav button small{display:block;font-size:10px;font-weight:600;letter-spacing:.5px}
nav button.on{color:var(--gold);background:#ffffff0d}
nav .dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--red);font-size:10px;font-weight:700;color:#fff;display:none;align-items:center;justify-content:center}
nav .dot.on{display:flex}
/* overlays */
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:80;pointer-events:none}
.toast{padding:8px 16px;border-radius:14px;background:linear-gradient(90deg,#0d9488,#2dd4bf);color:#04211d;font-weight:700;font-size:14px;box-shadow:0 6px 16px #0008;animation:tin .3s,tout .4s 3s forwards}
.toast.gold{background:linear-gradient(90deg,#f59e0b,#fde047);color:#3a2300}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#banner{position:fixed;left:0;right:0;top:32%;z-index:85;text-align:center;pointer-events:none;display:none}
#banner.on{display:block;animation:bn 2.4s forwards}
#banner .b1{font-family:'Lilita One',sans-serif;font-size:44px;color:var(--gold);text-shadow:0 4px 0 #7c4a03,0 0 30px #fbbf24aa;letter-spacing:2px}
#banner .b2{display:inline-block;margin-top:4px;padding:6px 18px;border-radius:99px;background:#0b1430e6;border:2px solid var(--gold);font-weight:700;font-size:18px}
@keyframes bn{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.2);opacity:1}20%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.1);opacity:0}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70;animation:fl .5s}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-4px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.float{position:fixed;z-index:65;font-family:'Lilita One',sans-serif;font-size:20px;color:var(--gold);text-shadow:0 2px 0 #7c4a03,0 0 8px #000;pointer-events:none;animation:up 1.1s ease-out forwards;white-space:nowrap}
.float.big{font-size:30px;color:#fff}
@keyframes up{from{transform:translate(-50%,0) scale(.7);opacity:1}to{transform:translate(-50%,-70px) scale(1.1);opacity:0}}
#modal{position:fixed;inset:0;z-index:90;background:#040a18cc;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{width:100%;max-width:460px;max-height:92vh;overflow-y:auto;border-radius:22px;background:linear-gradient(180deg,#1c3873,#12244a);border:3px solid var(--gold);padding:18px;box-shadow:0 0 40px #fbbf2444,0 20px 50px #000a;animation:pop .3s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.mbox h2{margin:0 0 8px;text-align:center;font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;color:var(--gold);letter-spacing:1px}
.mbox .center{text-align:center}
.mbox .huge{font-family:'Lilita One',sans-serif;font-size:42px;color:var(--gold);text-shadow:0 3px 0 #7c4a03}
.speaker{display:flex;gap:12px;align-items:flex-start}
.speaker .av{font-size:44px;width:64px;height:64px;flex:none;border-radius:18px;background:#0b1430;display:flex;align-items:center;justify-content:center;border:2px solid var(--teal)}
.speaker .say{flex:1;font-size:16px;line-height:1.45;min-height:96px}
.speaker .who{font-weight:700;color:var(--teal);font-size:13px;letter-spacing:1px;margin-bottom:2px}
.wheelwrap{position:relative;width:290px;height:290px;margin:8px auto}
.wheelwrap canvas{width:290px;height:290px;border-radius:50%;box-shadow:0 0 0 6px var(--gold),0 0 30px #fbbf2466}
.ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2;filter:drop-shadow(0 3px 3px #000)}
.hub{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:radial-gradient(#fde68a,#f59e0b);border:3px solid #fff8;display:flex;align-items:center;justify-content:center;font-size:24px}
#golden{position:fixed;z-index:75;font-size:54px;cursor:pointer;display:none;filter:drop-shadow(0 0 14px #fbbf24) drop-shadow(0 0 30px #f59e0b)}
#golden.on{display:block;animation:gfloat 10s linear forwards}
#golden span{display:block;animation:spin 1.6s ease-in-out infinite}
@keyframes spin{50%{transform:rotateY(180deg) scale(1.2)}}
@keyframes gfloat{from{left:-80px;top:var(--gy)}to{left:105vw;top:calc(var(--gy) + 60px)}}
.credit{text-align:center;font-size:12px;color:var(--dim);margin:18px 0 6px}
.credit a{color:var(--teal)}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">
  <header>
    <div id="mascot" title="Tap Ivory!"></div>
    <div class="cashbox"><div class="lbl">PRACTICE CASH</div><div id="cash">$0</div><div id="inc">$0 / sec</div></div>
    <div class="hbtns"><button id="bWheel" title="Lucky Wheel">🎡</button><button id="bSfx" title="Sound">🔊</button><button id="bMus" title="Music">🎵</button></div>
  </header>

const SUF = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<1000) return Math.abs(n-Math.round(n))<0.005 ? String(Math.round(n)) : n.toFixed(n<10?2:1).replace(/\.0$/,'');

  let v = n/Math.pow(1000,idx);
  if(v.toFixed(2).startsWith('1000') && idx+1<SUF.length){ idx++; v=n/Math.pow(1000,idx); }
  return v.toFixed(2)+SUF[idx];
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d = JSON.parse(raw), base = newState();
    for(const k in base){ if(d[k]!==undefined) base[k] = (typeof base[k]==='object' && !Array.isArray(base[k]) && base[k]!==null) ? Object.assign(base[k], d[k]) : d[k]; }
    ['own','mgr','prog','running'].forEach(k=>{ if(!Array.isArray(base[k])||base[k].length!==N) base[k]=newState()[k]; });
    S = base; return true;
  }catch(e){ console.warn('load failed',e); return false; }
}

function fmtTime(s){
  if(s<1) return s.toFixed(1)+'s';
  s=Math.ceil(s); if(s<60) return s+'s';
  if(s<3600) return Math.floor(s/60)+'m '+(s%60)+'s';
  if(s<86400) return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';
  return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h';
}

const G = { rev:[], cyc:[], rps:[], inc:0, global:1, speedN:[], profitN:[] };
function lpBonus(){ return 1 + 0.02*S.lp; }
function achBonus(){ return 1 + 0.01*Object.keys(S.ach).length; }
function minOwn(){ return Math.min(...S.own); }
function recalc(){
  const now = Date.now();
  S.buffs = S.buffs.filter(b=>b.until>now);
  let g = achBonus()*lpBonus();
  if(S.perks.ref) g*=1.5; if(S.perks.brand) g*=2;
  S.buffs.forEach(b=>g*=b.mult);
  const mo = minOwn(); GMS_LIST.forEach(m=>{ if(mo>=m) g*=GMS_MULT; });
  UPGS.forEach(u=>{ if(S.upg[u.id] && u.biz===-1) g*=u.mult; });
  G.global = g; G.inc = 0;
  for(let i=0;i<N;i++){
    const b=BIZ[i]; let m=1, sp=0;
    MS_LIST.forEach(ms=>{ if(S.own[i]>=ms){ const k=msKind(ms); if(k.type==='speed') sp++; else m*=k.mult; }});
    UPGS.forEach(u=>{ if(u.biz===i && S.upg[u.id]) m*=u.mult; });
    let raw = b.time/Math.pow(2,sp), cyc = Math.max(0.25, raw);
    if(raw<0.25) m*=0.25/raw;
    G.cyc[i]=cyc; G.rev[i]=b.rev*S.own[i]*m*g; G.rps[i]=G.rev[i]/cyc;
    if(S.mgr[i]) G.inc += G.rps[i];
  }
}
function costFor(i,n){ const b=BIZ[i], r=b.coef; return b.cost*Math.pow(r,S.own[i])*(Math.pow(r,n)-1)/(r-1); }
function maxAff(i){
  const b=BIZ[i], c0=b.cost*Math.pow(b.coef,S.own[i]);
  let n=Math.floor(Math.log(1+S.cash*(b.coef-1)/c0)/Math.log(b.coef));
  if(!isFinite(n)||n<0) n=0;
  while(n>0 && costFor(i,n)>S.cash) n--;
  return n;
}
function nextMs(i){ return MS_LIST.find(m=>m>S.own[i]); }
function buyCount(i){
  const m=S.buyMode;
  if(m==='max') return maxAff(i);
  if(m==='next'){ const nx=nextMs(i); return nx?nx-S.own[i]:1; }
  return parseInt(m,10);
}
/* =====================================================================
   LEVEL CAP — Halloween-only experiment. Each unmanaged practice can only
   be bought up to its next unreached milestone (25, then 50, then 75...);
   past that the buy button locks until you hire that practice's manager,
   which uncaps it for good. This turns "hire the manager" from a nice-to-
   have into the thing that actually keeps growth moving — pure unit-
   stacking stalls out on its own once every practice hits its ceiling,
   so cash piles up with nowhere productive to go until you reinvest in
   managers instead of just buying more. Scoped to the Halloween theme
   only for now (an experiment, not a change to the base game's economy).
   ===================================================================== */
function levelCapped(i){ return THEME.id==='halloween' && !S.mgr[i]; }
// The current bracket's ceiling: smallest milestone >= what's owned right
// now. Uses >= (not nextMs's strictly-greater) so landing EXACTLY on a
// milestone holds the cap there instead of jumping straight to the next
// one — nextMs(25) is 50 (the next thing to aim for, for display), but
// the cap at own=25 needs to stay 25 until the manager lifts it.
function levelCap(i){ return MS_LIST.find(m=>m>=S.own[i]); } // null once past the top milestone
function effectiveBuyCount(i){
  let n=Math.max(1,buyCount(i));
  if(levelCapped(i)){ const cap=levelCap(i); if(cap!=null) n=Math.min(n, Math.max(0,cap-S.own[i])); }
  return n;
}
function pendingLP(){ return Math.floor(10*Math.sqrt(S.run/1e10)); }
function minutesIncome(m){ return Math.max(G.inc*60*m, m*30 + S.run*0.002*m); }

const SFX = (()=>{
  let ctx, master, sfx, music, drone, windTimer=null, noiseBuf, mTimer=null, nextT=0, step=0;
  const PENT=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
  // Halloween: swap the bright major pentatonic for a minor pentatonic (C Eb F G Bb,
  // the classic "spooky/blues" scale) — same 8-slot shape as PENT so it's a drop-in
  // replacement everywhere a scale degree is looked up by index.
  const MINOR_PENT=[523.25,622.25,698.46,783.99,932.33,1046.5,1244.51,1396.91];

  function init(){
    if(ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); master=ctx.createGain(); const comp=ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    sfx=ctx.createGain(); sfx.gain.value=S.settings.sfxOn?S.settings.sfx:0; sfx.connect(master);
    music=ctx.createGain(); music.gain.value=S.settings.music*0.5; music.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  function resume(){ init(); if(ctx && ctx.state==='suspended') ctx.resume(); }
  function tone(f,d=0.15,type='sine',v=0.2,at=0,slide=0,dest){
    if(!ctx||!S.settings.sfxOn&&!dest) return;
    const t=ctx.currentTime+at, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);

    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+d);

      noise(.7,.08,7000,.35); tone(130,.6,'sine',.2,0,.5);

  const CH = HW

      const n=ch[[0,1,2,3,2,1,2,3][step%8]]*2;
      tone(n,STEP_DUR*1.5,HW?'sawtooth':'triangle',HW?.035:.05,at,0,music);
      if(step%4===2) tone(n*2,.25,'sine',.02,at+.16,0,music);
      nextT+=STEP_DUR; step++;
    }
  }
  // Halloween-only: a thicker ambient bed underneath the chord loop — two
  // slightly-detuned low drones beating against each other (an unsettling
  // "hum" a single oscillator can't give), plus wind gusts, door creaks and
  // distant howls scattered around at random for atmosphere.
  let droneOsc, drone2, droneGain, windGustTO;
  function startDrone(){
    if(!ctx || droneOsc) return;
    droneOsc=ctx.createOscillator(); drone2=ctx.createOscillator(); droneGain=ctx.createGain();
    droneOsc.type='sine'; droneOsc.frequency.value=55;    // low A1, a felt sub-rumble
    drone2.type='sine'; drone2.frequency.value=55*1.5+0.8; // detuned fifth, slow beating
    const lfo=ctx.createOscillator(), lfoGain=ctx.createGain();
    lfo.frequency.value=0.13; lfoGain.gain.value=6; // slow detune wobble
    lfo.connect(lfoGain); lfoGain.connect(droneOsc.frequency);
    droneGain.gain.value=0.075;
    droneOsc.connect(droneGain); drone2.connect(droneGain); droneGain.connect(music);
    droneOsc.start(); drone2.start(); lfo.start();
    const creak=()=>{
      if(!ctx) return;
      const t=ctx.currentTime, s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
      s.buffer=noiseBuf; f.type='bandpass'; f.Q.value=8;
      f.frequency.setValueAtTime(rnd(220,320),t); f.frequency.exponentialRampToValueAtTime(rnd(500,900),t+rnd(.6,1.1));
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.1); g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
      s.connect(f); f.connect(g); g.connect(music); s.start(t); s.stop(t+1.3);
    };
    const howl=()=>{
      if(!ctx) return;
      const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(rnd(260,320),t);
      o.frequency.linearRampToValueAtTime(rnd(420,520),t+1.2); o.frequency.linearRampToValueAtTime(rnd(180,240),t+3.2);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.045,t+.8); g.gain.exponentialRampToValueAtTime(0.0001,t+3.4);
      o.connect(g); g.connect(music); o.start(t); o.stop(t+3.5);
    };
    const gust=()=>{
      if(!droneOsc) return;
      const roll=Math.random();
      if(roll<.55) noise(rnd(2.5,4.5),.035,900,0);
      else if(roll<.8) creak();
      else howl();
      windGustTO=setTimeout(gust,rnd(5000,11000));
    };
    windGustTO=setTimeout(gust,rnd(1800,4000));
  }
  function stopDrone(){
    if(droneOsc){ try{droneOsc.stop();}catch(e){} droneOsc=null; }
    if(drone2){ try{drone2.stop();}catch(e){} drone2=null; }
    clearTimeout(windGustTO);
  }
  return api;
})();

/* =====================================================================
   HALLOWEEN PRIZE TIERS — real, permanent items in DSO Empire Simulator,
   unlocked automatically the deeper you get here. Both games are hosted
   on the same domain (see the theme layer above), so this just writes to
   a small shared localStorage key that the main game reads on its own
   boot — no code for the player to type, no account, nothing to copy.
   Each tier is strictly harder than the last; reaching one also implies
   every easier one, so the list always ends up fully granted in order.

   Five cards, matching the rarity/bonus curve every other desk-card pack
   in the main game already uses (common/uncommon/rare/epic/legendary,
   bonusPct .005/.01/.02/.04/.08 — see index.html's other 5-card sets).
   Thresholds are lifetime-earnings-based (smooth, continuous, and easy to
   show as a % bar — no plateauing "own N of a business" milestone a
   focused player can blow through by spamming one buy button). Tiers 1-3
   are calibrated to a greedy, always-reinvesting "above-average engaged"
   player (roughly 1h/2h/3h of play, from a continuous-play simulation of
   this game's own cost/revenue curves, anchored to a real playtest data
   point — Tier 1 was clocked at ~5 real minutes). Tier 4 and the final
   Tier 5 are calibrated instead to a "moderate" player — someone who
   checks in a handful of times a day for a few minutes, not someone
   glued to the buy button — landing Tier 5 (the legendary card, the one
   that headlines the hand-off to the main game) at roughly 48 hours of
   real time for that persona, per a session-gated simulation of the same
   formulas. HW_SPACING_MS is a tiny debounce (not a real gate) so an
   offline catch-up that crosses two thresholds in the same tick doesn't
   fire two banners at once.
   ===================================================================== */
const SE_PENDING_KEY = 'smile-empire-halloween-rewards-v1';
const HW_SPACING_MS = 5*60e3; // debounce only — thresholds themselves set the pace
const HW_TIERS = [
  { id:'hw-stapler',            name:'The Haunted Stapler',     rarity:'common',    art:'hwCard0', goal:1e11  },
  { id:'hw-audit-ghost',        name:'The Audit Ghost',         rarity:'uncommon',  art:'hwCard1', goal:5e11  },
  { id:'hw-chair7',             name:'Haunted Chair 7',         rarity:'rare',      art:'hwCard2', goal:2.7e12},
  { id:'hw-zombie-noncompete',  name:'The Zombie Non-Compete',  rarity:'epic',      art:'hwCard3', goal:1e14  },
  { id:'hw-rollup-reaper',      name:'The Rollup Reaper',       rarity:'legendary', art:'hwCard4', goal:5e17  },
].map((t,i,arr)=>({ ...t,
  need:S=>S.life>=t.goal,
  hint:'Earn '+$$$(t.goal)+' lifetime',
  // Segment-relative progress (from the previous tier's goal to this one's)
  // reads far more honestly than life/goal once the goals span many orders
  // of magnitude — otherwise Tier 5 would look like "0%" for hours even
  // after a player is well past Tier 4.
  pct:S=>{ const prevGoal=i>0?arr[i-1].goal:0; const span=t.goal-prevGoal; return span>0?(S.life-prevGoal)/span:1; },
}));
// Per-tier display state for the progress tracker / prize panel:
// 'got' (already granted), 'ready' (threshold met, granting this tick),
// 'waiting' (threshold met, but still serving out the debounce — etaMs
// left), or 'locked' (threshold not met yet, pct 0-1 shows how close).
function hwTierState(idx){
  const t=HW_TIERS[idx];
  if(S.hwGranted[t.id]) return {status:'got'};
  const met=t.need(S);
  const pct=Math.max(0,Math.min(1,t.pct(S)));
  const prev=HW_TIERS[idx-1];
  const gateAt = idx===0 ? 0 : (prev && S.hwGranted[prev.id] ? S.hwGranted[prev.id]+HW_SPACING_MS : Infinity);
  if(!met) return {status:'locked', pct};
  if(Date.now()>=gateAt) return {status:'ready', pct:1};
  return {status:'waiting', pct:1, etaMs: gateAt===Infinity ? null : gateAt-Date.now()};
}
function checkHalloween(){
  if(THEME.id!=='halloween') return;
  if(!S.hwEligibleAt) S.hwEligibleAt={};
  let newly=[];
  HW_TIERS.forEach((t,idx)=>{
    if(S.hwGranted[t.id]) return;
    if(t.need(S) && !S.hwEligibleAt[t.id]) S.hwEligibleAt[t.id]=Date.now();
    const st=hwTierState(idx);
    if(st.status==='ready'){ S.hwGranted[t.id]=Date.now(); newly.push(t); }
  });
  if(!newly.length) return;
  let pending=[];
  try{ pending=JSON.parse(localStorage.getItem(SE_PENDING_KEY)||'[]'); }catch(e){}
  newly.forEach(t=>{ if(!pending.some(p=>p.id===t.id)) pending.push({id:t.id, at:Date.now()}); });
  try{ localStorage.setItem(SE_PENDING_KEY, JSON.stringify(pending)); }catch(e){}
  newly.forEach(t=>{
    banner('PRIZE UNLOCKED!', t.name+' — waiting for you in DSO Empire Simulator');
    toast('🎃 '+t.name+' unlocked — permanent item in DSO Empire Simulator!', true);
  });
  SFX.spookyWin(); celebrate(true); renderHwTrack(); save();
}
function hwNextLine(){
  const idx = HW_TIERS.findIndex(t=>!S.hwGranted[t.id]);
  if(idx===-1) return '🏆 All '+HW_TIERS.length+' Fright Night prizes collected — check DSO Empire Simulator!';
  const t=HW_TIERS[idx], st=hwTierState(idx);
  if(st.status==='waiting') return st.etaMs==null ? 'Next: '+t.name+' — almost there!' : 'Next: '+t.name+' unlocks in '+fmtTime(st.etaMs/1000);
  if(st.status==='ready') return 'Next: '+t.name+' — unlocking now…';
  return 'Next: '+t.name+' — '+t.hint+' ('+Math.floor(st.pct*100)+'%)';
}
function renderHwTrack(){
  const wrap=$('#hwTrack'); if(!wrap) return;
  if(THEME.id!=='halloween'){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  const got=HW_TIERS.filter(t=>S.hwGranted[t.id]).length;
  setT('hwt-count', got+'/'+HW_TIERS.length);
  let nodes='';
  HW_TIERS.forEach((t,idx)=>{
    const st=hwTierState(idx);
    const art=ART[t.art];
    const cls = st.status==='got' ? 'got' : (st.status==='waiting'||st.status==='ready') ? 'waiting' : '';
    const badge = st.status==='got' ? '✔' : (st.status==='waiting'||st.status==='ready') ? '⏳' : '🔒';
    const pctW = st.status==='got' ? 100 : Math.floor((st.pct||0)*100);
    nodes+='<div class="hwt-node '+cls+'" title="'+t.name+'">'+(art?'<img src="'+art+'" alt="">':'🎃')+'<i class="pr" style="width:'+pctW+'%"></i><span class="lk">'+badge+'</span></div>';
    if(idx<HW_TIERS.length-1) nodes+='<div class="hwt-link '+(S.hwGranted[t.id]?'done':'')+'"></div>';
  });
  setH('hwt-nodes', nodes);
  // Prominent lifetime-earnings bar toward the NEXT uncollected card,
  // segment-relative like the per-node pct above (previous tier's goal
  // to this one's) so it always reads as real, visible progress instead
  // of flatlining near-zero once the later goals get astronomically big.
  const nextIdx = HW_TIERS.findIndex(t=>!S.hwGranted[t.id]);
  const fill=$('#hwt-lifebar-fill'), lbl=$('#hwt-lifebar-label');
  if(fill && lbl){
    if(nextIdx===-1){
      fill.style.width='100%'; lbl.textContent='All 5 cards collected 🏆';
    }else{
      const t=HW_TIERS[nextIdx], prevGoal=nextIdx>0?HW_TIERS[nextIdx-1].goal:0;
      const pctW=Math.max(0,Math.min(100,Math.floor((hwTierState(nextIdx).pct||0)*100)));
      fill.style.width=pctW+'%';
      lbl.textContent=$$$(S.life)+' / '+$$$(t.goal)+' lifetime — '+t.name+' ('+pctW+'%)';
    }
  }
  setT('hwt-next', hwNextLine());
}

  $('#vM').oninput=e=>{ S.settings.music=+e.target.value; SFX.setMusicVol(); };
  $('#exp').onclick=()=>{ save(); const code=btoa(unescape(encodeURIComponent(JSON.stringify(S)))); openModal('<h2>Export Save</h2><p class="note">Copy this code somewhere safe:</p><textarea id="ta" style="width:100%;height:120px;user-select:text;-webkit-user-select:text">'+code+'</textarea><button class="bigbtn" id="ok" style="background:linear-gradient(#5eead4,#0d9488);color:#03211d">Close</button>'); $('#ok').onclick=closeModal; $('#ta').select(); };
  $('#imp').onclick=()=>{ openModal('<h2>Import Save</h2><textarea id="ta" style="width:100%;height:120px;user-select:text;-webkit-user-select:text" placeholder="Paste save code"></textarea><button class="bigbtn" id="ok" style="background:linear-gradient(#5eead4,#0d9488);color:#03211d">Load</button><button class="mini" style="width:100%" id="no">Cancel</button>'); $('#no').onclick=closeModal;
    $('#ok').onclick=()=>{ try{ const d=JSON.parse(decodeURIComponent(escape(atob($('#ta').value.trim())))); localStorage.setItem(SAVE_KEY,JSON.stringify(d)); location.reload(); }catch(e){ SFX.err(); toast('Invalid save code'); } }; };
  $('#rst').onclick=()=>{ openModal('<h2>Reset Everything?</h2><div class="center">This permanently deletes your save.</div><button class="bigbtn" id="yes" style="background:linear-gradient(#fca5a5,#ef4444);color:#fff">Delete Save</button><button class="mini" style="width:100%" id="no">Cancel</button>'); $('#no').onclick=closeModal; $('#yes').onclick=()=>{ localStorage.removeItem(SAVE_KEY); location.reload(); }; };
}
function renderAll(){ renderBiz(); renderModes(); renderManagers(); renderUpgrades(); renderUnlocks(); renderLegacy(); renderMore(); renderHwTrack(); }

/* ---------- Nav ---------- */
const TABS=[['biz','🏥','Practice'],['mgr','🧑‍⚕️','Managers'],['upg','⚙️','Upgrades'],['unl','🔓','Unlocks'],['leg','🏆','Legacy'],['more','☰','More']];
function buildNav(){
  const n=$('#nav'); n.innerHTML='';
  TABS.forEach(([k,ic,l],idx)=>{ const b=document.createElement('button'); b.dataset.k=k; b.innerHTML=ic+'<small>'+l+'</small><span class="dot" id="dot-'+k+'"></span>'; if(idx===0) b.className='on';
    b.onclick=()=>{ SFX.resume(); SFX.click(3); showTab(k); }; n.appendChild(b); });
}
function showTab(k){
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k)); $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+k));
  if(k==='unl') renderUnlocks(); if(k==='leg') renderLegacy(); if(k==='more') renderMore(); if(k==='upg') renderUpgrades(); if(k==='mgr') renderManagers();
  if(k==='more' && THEME.id==='halloween'){ HW_TIERS.forEach(t=>{ if(S.hwGranted[t.id]) S.hwSeen[t.id]=true; }); updateAll(); }
}

/* ---------- Per-frame UI ---------- */
const cache={};
function setT(id,v){ if(cache[id]!==v){ cache[id]=v; const e=document.getElementById(id); if(e) e.textContent=v; } }
function setH(id,v){ if(cache['h'+id]!==v){ cache['h'+id]=v; const e=document.getElementById(id); if(e) e.innerHTML=v; } }
function setCls(el,cls,on){ if(el.classList.contains(cls)!==on) el.classList.toggle(cls,on); }
function mostUnlocked(){ let h=0; for(let i=0;i<N;i++) if(S.own[i]>0) h=i; return h; }
let goalTarget=null;
function updateAll(force){
  setT('cash',$$$(S.cash));
  const nonMgr=S.mgr.some(x=>x);
  setT('inc', nonMgr? $$$(G.inc)+' / sec' : 'Tap a practice to earn!');
  setT('lpb', S.lp>0 ? '💎 '+S.lp+' LP (+'+Math.round((lpBonus()-1)*100)+'%)':'');
  const hi=mostUnlocked();
  for(let i=0;i<N;i++){
    const d=bizEls[i]; if(!d) continue;
    const vis = i<=hi+2; d.style.display = vis?'':'none'; if(!vis) continue;
    const myst = i===hi+2; setCls(d,'myst',myst);
    const owned=S.own[i]>0;
    if(myst){ setT('nm'+i,'???'); setT('btxt'+i,'Keep growing to reveal'); setT('bl'+i,'LOCKED'); setT('bc'+i,''); setT('own'+i,'?'); setT('mst'+i,''); $('#fill'+i).style.width='0'; setCls($('#buy'+i),'can',false); $('#msb'+i).style.width='0'; continue; }
    setT('nm'+i,BIZ[i].name); setT('own'+i,S.own[i]);
    const fill=$('#fill'+i);
    if(owned){
      const flow = S.mgr[i] && G.cyc[i]<0.4;
      setCls(fill,'flow',flow);
      fill.style.width = flow?'100%':(S.prog[i]*100).toFixed(1)+'%';
      const active=S.mgr[i]||S.running[i];
      setT('btxt'+i, active && !flow ? fmtTime((1-S.prog[i])*G.cyc[i])+'  •  '+$$$(G.rev[i]) : $$$(G.rev[i])+(flow?' / cycle':''));
      setCls($('#ic'+i),'idle',!S.mgr[i] && !S.running[i]);
    } else { fill.style.width='0'; setT('btxt'+i,'Not yet opened'); setCls($('#ic'+i),'idle',false); }
    const nx=nextMs(i), prev=[0,...MS_LIST].filter(m=>m<=S.own[i]).pop();
    const cap=levelCap(i), capped = owned && levelCapped(i) && cap!=null && S.own[i]>=cap;
    if(nx){ const k=msKind(nx); $('#msb'+i).style.width=((S.own[i]-prev)/(nx-prev)*100).toFixed(1)+'%';
      setT('mst'+i, capped ? '🔒 Capped at '+cap+' — hire manager to unlock more' : S.own[i]+'/'+nx+' → '+k.label); }
    else { $('#msb'+i).style.width='100%'; setT('mst'+i,'All milestones unlocked!'); }
    if(capped){
      setT('bl'+i,'🔒 CAPPED'); setT('bc'+i,'Hire manager'); setCls($('#buy'+i),'can',false);
    } else {
      const n=effectiveBuyCount(i), cost=costFor(i,n), can=S.cash>=cost;
      setT('bl'+i, !owned?'OPEN': S.buyMode==='max'?'MAX ×'+n: S.buyMode==='next'?'NEXT ×'+n:'BUY ×'+n); setT('bc'+i,$$$(cost)); setCls($('#buy'+i),'can',can);
    }
  }
  // goal chip
  let best=null,bf=-1;
  for(let i=0;i<N;i++){ if(S.own[i]<=0) continue; const nx=nextMs(i); if(!nx) continue; const f=S.own[i]/nx; if(f>bf){bf=f;best=i;} }
  if(best!==null){ const nx=nextMs(best); goalTarget=best; setT('goalT',BIZ[best].name+' '+S.own[best]+'/'+nx+' → '+msKind(nx).label); $('#goalB').style.width=(bf*100)+'%'; } else { goalTarget=null; setT('goalT','Tap your chair to treat a patient!'); }
  // buffs
  const now=Date.now(); setH('buffs',S.buffs.filter(b=>b.until>now).map(b=>'<span class="buff">'+b.name+' · '+fmtTime((b.until-now)/1000)+'</span>').join(''));
  // wheel btn
  setCls($('#bWheel'),'ready',wheelReady());
  // list affordability
  $$('#p-mgr .hire').forEach(b=>{ if(b.classList.contains('done')) return; setCls(b,'can',S.cash>=+b.dataset.cost); });
  $$('#p-upg .hire').forEach(b=>setCls(b,'can',S.cash>=+b.dataset.cost));
  // nav badges
  const mAff=BIZ.filter((b,i)=>!S.mgr[i]&&S.cash>=b.mgr&&S.own[i]>0).length; const uAff=UPGS.filter(u=>!S.upg[u.id]).slice(0,14).filter(u=>S.cash>=u.cost).length;
  const hwNew=THEME.id==='halloween' && HW_TIERS.some(t=>S.hwGranted[t.id] && !S.hwSeen[t.id]) ? '🎃' : 0;
  [['mgr',mAff],['upg',uAff],['leg',pendingLP()>=1?'!':0],['more',hwNew]].forEach(([k,v])=>{ const e=$('#dot-'+k); if(e){ e.textContent=v; e.classList.toggle('on',!!v); } });
}
$('#goal').onclick=()=>{ if(goalTarget===null) return; const i=goalTarget, n=nextMs(i)-S.own[i], cost=costFor(i,n);
  if(S.cash>=cost){ const m=S.buyMode; S.buyMode='next'; buy(i); S.buyMode=m; } else { SFX.err(); toast('Need '+$$$(cost)+' to hit the next milestone'); } };
$('#mascot').onclick=()=>{ SFX.resume(); const a=Math.max(1,G.inc*0.5); earn(a); SFX.coin(Math.floor(rnd(0,8))); const r=$('#mascot').getBoundingClientRect(); floatText(r.left+r.width/2,r.top+10,'+'+$$$(a)); burst(r.left+r.width/2,r.top+r.height/2,5,'coin'); S.stats.taps++; };
$('#bWheel').onclick=()=>{ SFX.resume(); SFX.click(6); openWheel(); };
$('#bSfx').onclick=()=>{ SFX.resume(); S.settings.sfxOn=!S.settings.sfxOn; SFX.setSfx(); $('#bSfx').textContent=S.settings.sfxOn?'🔊':'🔇'; if(S.settings.sfxOn) SFX.click(4); };
$('#bMus').onclick=()=>{ SFX.resume(); S.settings.musicOn=!S.settings.musicOn; $('#bMus').style.opacity=S.settings.musicOn?1:.4; S.settings.musicOn?SFX.musicOn():SFX.musicOff(); toast(S.settings.musicOn?'🎵 Music on':'🎵 Music off',false); save(); };

/* =====================================================================
   Main loop
   ===================================================================== */
let last=performance.now(), acc=0, sec=0, saveT=0, tipI=0, tipT=0;
function tick(dt){
  for(let i=0;i<N;i++){
    if(S.own[i]<=0) continue;
    if(S.mgr[i]){
      S.prog[i]+=dt/G.cyc[i];
      if(S.prog[i]>=1){ const c=Math.floor(S.prog[i]); S.prog[i]-=c; const a=c*G.rev[i]; earn(a); collectFx(i,a,false); }
    } else if(S.running[i]){
      S.prog[i]+=dt/G.cyc[i];
      if(S.prog[i]>=1){ S.prog[i]=0; S.running[i]=false; earn(G.rev[i]); collectFx(i,G.rev[i],true); }
    }
  }
}
function collectFx(i,a,manual){
  const now=performance.now(); if(document.hidden) return;
  if(manual){ SFX.coin(Math.min(combo,12)); floatAt($('#ic'+i),'+'+$$$(a), a>G.inc*30&&G.inc>0); if(a>=1e3) SFX.ching(); }
  else if(now-lastCoinSnd>140 && $('#p-biz').classList.contains('on')){ lastCoinSnd=now; SFX.coin(i); if(G.cyc[i]>.6) floatAt($('#ic'+i),'+'+$$$(a)); }
}
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>3600) dt=3600; if(dt<0) dt=0;
  tick(dt); sec+=dt; saveT+=dt; tipT+=dt;
  if(sec>=1){ sec=0; recalc(); checkAch(); checkStory(); checkHalloween(); renderHwTrack(); if(Date.now()>S.nextGolden && !modalOpen) { spawnGolden(); scheduleGolden(); } if(document.getElementById('p-leg').classList.contains('on')) updateLegacyLive(); }
  if(saveT>=5){ saveT=0; save(); }
  if(tipT>=14){ tipT=0; tipI=(tipI+1)%TIPS.length; setT('tip',TIPS[tipI]); }
  updateAll(); drawFx();
  requestAnimationFrame(frame);
}
function updateLegacyLive(){ const b=$('#sellBtn'); if(!b) return; const g=pendingLP(); b.textContent=g>=1?'SELL PRACTICE → +'+g+' LP':'Earn $100M this run to sell (1 LP)'; b.classList.toggle('dis',g<1); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); else last=performance.now(); });
addEventListener('beforeunload',save);
// Self-healing: every tap anywhere in the game re-checks that music is
// actually running whenever it's supposed to be on. Covers cases where the
// original "start music" tap landed on a full-screen modal overlay (which
// silently eats the click before it reaches the header button) or where the
// browser's autoplay-gesture policy didn't let the very first attempt take —
// musicOn() itself is a safe no-op if music is already playing.
addEventListener('pointerdown',()=>{ SFX.resume(); if(S.settings.musicOn) SFX.musicOn(); },{once:false,passive:true});

/* ---------- Side-game switch: back link to DSO Empire + event-window gate ---------- */
const PREVIEW = (()=>{ try{ return location.hostname!=='empire.dentalstrategyinstitute.com' && /[?&]event=fright-night/i.test(location.search); }catch(e){ return false; } })();
const DSO_HOME = '/?from=smile'+(PREVIEW?'&event=fright-night':'');
function eventOpen(){ return THEME.id!=='halloween' || PREVIEW || themeLive(); }
function showGate(){
  const before = THEME.start && Date.now()<Date.parse(THEME.start);
  const g=document.createElement('div'); g.id='gate';
  g.innerHTML = before
    ? '<div style="font-size:64px">🎃</div><h1>Fright Night opens Oct 24</h1><p>Play Smile Empire: Fright Night for one week only and win permanent desk cards that carry straight into DSO Empire Simulator.</p><a href="'+DSO_HOME+'">← Back to DSO Empire</a>'
    : '<div style="font-size:64px">👻</div><h1>Fright Night is over</h1><p>The haunted practice is closed for the season, but Smile Empire is coming back with a new challenge soon. Your prizes are safe in DSO Empire Simulator.</p><a href="'+DSO_HOME+'">← Back to DSO Empire</a>';
  document.body.appendChild(g);
}
function addBackLink(){
  const a=document.createElement('a'); a.id='dsoBack'; a.href=DSO_HOME; a.textContent='← DSO Empire'; document.body.appendChild(a);
}

/* ---------- Boot ---------- */
(function boot(){
  if(!eventOpen()){ showGate(); return; }
  if(THEME.id==='halloween') addBackLink();
  const had=load();
  buildNav(); renderAll(); recalc();
  // Halloween office-scene background: shows in the letterboxed margins around
  // the centered #app column on wide screens, and as a very dark base under
  // it everywhere else. Dark overlay gradients keep all panel text legible.
  if(THEME.id==='halloween' && ART.bgOffice){
    document.body.style.backgroundImage =
      'linear-gradient(180deg,#05060fcc,#05060fe8),'+
      'radial-gradient(1200px 600px at 50% -10%,#1b3a7a44,transparent 60%),'+
      'url("'+ART.bgOffice+'")';
    document.body.style.backgroundSize = 'auto, auto, cover';
    document.body.style.backgroundPosition = 'center, center, center 30%';
    document.body.style.backgroundRepeat = 'no-repeat, no-repeat, no-repeat';
    document.body.style.backgroundAttachment = 'fixed, fixed, fixed';
  }
  $('#bSfx').textContent=S.settings.sfxOn?'🔊':'🔇'; $('#bMus').style.opacity=S.settings.musicOn?1:.4;
  if(!S.nextGolden || S.nextGolden<Date.now()-1e9) scheduleGolden();
  checkAch(); setT('tip',TIPS[0]);
  if(had) offlineEarn();
  dailyCheck(); checkStory();
  if(S.settings.musicOn){ const start=()=>{ SFX.musicOn(); removeEventListener('pointerdown',start); }; addEventListener('pointerdown',start); }
  window.__game={S:()=>S,buy,hire,recalc,tick,renderAll,fmt,pendingLP,doSell,openWheel,spawnGolden};
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
})();
</script>
